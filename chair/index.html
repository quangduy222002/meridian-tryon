<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>NORDA · 3D Chair Configurator</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
  color: #1d1d1f; background: #f4f1ec; -webkit-font-smoothing: antialiased; overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; -webkit-tap-highlight-color: transparent; }
.app { display: grid; grid-template-columns: 1fr 380px; height: 100dvh; }
.viewer { position: relative; min-height: 0; touch-action: none; }
.viewer canvas { display: block; width: 100%; height: 100%; }
.brand { position: absolute; top: 20px; left: 24px; font-weight: 700; letter-spacing: .18em; font-size: 13px; }
.hint { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #8a857c; white-space: nowrap; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: #8a857c; font-size: 14px; }

.panel { background: #fff; border-left: 1px solid #e8e3da; padding: 28px 24px 0; overflow-y: auto; display: flex; flex-direction: column; gap: 24px; }
.panel h1 { font-size: 22px; font-weight: 650; }
.panel h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: #8a857c; margin-bottom: 10px; display: flex; justify-content: space-between; }
.panel h2 span { color: #1d1d1f; text-transform: none; letter-spacing: 0; }
small { color: #8a857c; font-size: 11px; margin-left: 4px; }

.chips { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.chip { display: flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 12px; border: 1.5px solid #e8e3da; border-radius: 12px; text-align: left; font-size: 14px; transition: border-color .15s; }
.chip i { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); }
.chip.active { border-color: #1d1d1f; }

.segmented { display: flex; background: #f4f1ec; border-radius: 12px; padding: 4px; }
.segmented button { flex: 1; min-height: 40px; border-radius: 9px; font-size: 14px; transition: background .15s, box-shadow .15s; }
.segmented button.active { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.12); font-weight: 600; }

.swatches { display: flex; gap: 12px; flex-wrap: wrap; }
.swatch { width: 44px; height: 44px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); outline: 2px solid transparent; outline-offset: 3px; transition: outline-color .15s, transform .15s; }
.swatch.active { outline-color: #1d1d1f; transform: scale(1.05); }

.toggle { display: flex; align-items: center; gap: 12px; font-size: 15px; cursor: pointer; min-height: 44px; }
.toggle input { display: none; }
.track { width: 46px; height: 28px; border-radius: 14px; background: #d8d2c7; position: relative; transition: background .2s; }
.thumb { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s; }
.toggle input:checked + .track { background: #1d1d1f; }
.toggle input:checked + .track .thumb { transform: translateX(18px); }

footer { position: sticky; bottom: 0; margin-top: auto; background: #fff; border-top: 1px solid #e8e3da; padding: 16px 0 calc(20px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 8px; }
.price { flex: 1; display: flex; flex-direction: column; }
.price small { margin: 0; }
.price strong { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.primary, .ghost { min-height: 46px; padding: 0 18px; border-radius: 12px; font-weight: 600; font-size: 14px; }
.primary { background: #1d1d1f; color: #fff; }
.ghost { border: 1.5px solid #e8e3da; }

.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1d1d1f; color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.2); animation: pop .25s ease-out; z-index: 10; max-width: 90vw; text-align: center; }
@keyframes pop { from { opacity: 0; transform: translate(-50%, -8px); } }

.modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; place-items: center; z-index: 20; padding: 24px; }
.modal.open { display: grid; }
.modal-card { background: #fff; border-radius: 18px; padding: 16px; max-width: 560px; width: 100%; display: flex; flex-direction: column; gap: 12px; }
.modal-card img { width: 100%; border-radius: 10px; background: #f4f1ec; }
.modal-card p { font-size: 13px; color: #8a857c; text-align: center; }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 52dvh 1fr; }
  .panel { border-left: none; border-top: 1px solid #e8e3da; border-radius: 20px 20px 0 0; padding-top: 20px; }
  .panel h1 { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <div class="viewer" id="viewer">
    <div class="loading" id="loading">Loading 3D…</div>
    <div class="brand">NORDA · Lounge Chair</div>
    <div class="hint">Drag to rotate · Pinch to zoom</div>
  </div>

  <aside class="panel">
    <h1>Customize your chair</h1>
    <section><h2>Frame <span id="frameLabel"></span></h2><div class="chips" id="frames"></div></section>
    <section><h2>Upholstery <span id="fabricLabel"></span></h2><div class="segmented" id="fabrics"></div></section>
    <section><h2>Color <span id="colorLabel"></span></h2><div class="swatches" id="colors"></div></section>
    <section><h2>Legs <span id="legLabel"></span></h2><div class="segmented" id="legs"></div></section>
    <section>
      <label class="toggle">
        <input type="checkbox" id="arms" />
        <span class="track"><span class="thumb"></span></span>
        Armrests <small id="armPrice"></small>
      </label>
    </section>
    <footer>
      <div class="price"><small>Total</small><strong id="price"></strong></div>
      <button class="ghost" id="snap">Snapshot</button>
      <button class="primary" id="cart">Add to cart</button>
    </footer>
  </aside>
</div>

<div class="modal" id="modal">
  <div class="modal-card">
    <img id="snapImg" alt="Your configured chair" />
    <p>Press and hold the image to save it</p>
    <button class="primary" id="closeModal">Done</button>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------- Catalogue ---------- */
const FRAMES = {
  oak:    { label: 'Oak',         color: '#c8a27a', metalness: 0,   roughness: 0.6,  price: 0 },
  walnut: { label: 'Walnut',      color: '#5b3a29', metalness: 0,   roughness: 0.5,  price: 40 },
  black:  { label: 'Black Metal', color: '#1c1c1e', metalness: 0.8, roughness: 0.35, price: 25 },
  brass:  { label: 'Brass',       color: '#b8903f', metalness: 1,   roughness: 0.25, price: 60 },
};
const FABRICS = {
  linen:   { label: 'Linen',   roughness: 0.95, sheen: 0, price: 0 },
  velvet:  { label: 'Velvet',  roughness: 0.75, sheen: 1, price: 30 },
  leather: { label: 'Leather', roughness: 0.35, sheen: 0, price: 80 },
};
const COLORS = [
  { name: 'Sand', hex: '#d9c9b0' }, { name: 'Sage', hex: '#8a9a7b' },
  { name: 'Terracotta', hex: '#c0603f' }, { name: 'Navy', hex: '#2b3a55' },
  { name: 'Charcoal', hex: '#3a3a3c' },
];
const LEGS = { straight: { label: 'Straight', price: 0 }, tapered: { label: 'Tapered', price: 15 } };
const BASE_PRICE = 249, ARMREST_PRICE = 35;
const usd = (n) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(n);

const state = { frame: 'oak', fabric: 'linen', color: COLORS[0].hex, legs: 'straight', arms: false };

/* ---------- Scene ---------- */
const viewer = document.getElementById('viewer');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
viewer.prepend(renderer.domElement);
document.getElementById('loading').remove();

const scene = new THREE.Scene();
scene.background = new THREE.Color('#f4f1ec');
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 50);
camera.position.set(2.2, 1.6, 2.4);

scene.add(new THREE.AmbientLight(0xffffff, 0.3));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(3, 5, 2);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.radius = 6;
Object.assign(sun.shadow.camera, { left: -2, right: 2, top: 2, bottom: -2, near: 0.5, far: 15 });
scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), new THREE.ShadowMaterial({ opacity: 0.18 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.6, 0);
controls.enablePan = false;
controls.enableDamping = true;
controls.minDistance = 1.8;
controls.maxDistance = 5;
controls.maxPolarAngle = Math.PI / 2.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.addEventListener('start', () => { controls.autoRotate = false; });

/* ---------- Chair ---------- */
const frameMat = new THREE.MeshPhysicalMaterial({ color: FRAMES.oak.color, roughness: 0.6, metalness: 0 });
const fabricMat = new THREE.MeshPhysicalMaterial({ color: COLORS[0].hex, roughness: 0.95, sheenRoughness: 0.5 });

const chair = new THREE.Group();
scene.add(chair);
const add = (parent, geo, mat, x, y, z) => {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  parent.add(m);
  return m;
};

// Seat
add(chair, new THREE.BoxGeometry(1, 0.06, 0.9), frameMat, 0, 0.48, 0);
add(chair, new RoundedBoxGeometry(0.96, 0.14, 0.88, 4, 0.05), fabricMat, 0, 0.58, 0);

// Backrest
const back = new THREE.Group();
back.position.set(0, 0.51, -0.42);
back.rotation.x = -0.12;
chair.add(back);
const postGeo = new THREE.CylinderGeometry(0.025, 0.025, 0.8, 16);
add(back, postGeo, frameMat, -0.46, 0.4, 0);
add(back, postGeo, frameMat, 0.46, 0.4, 0);
add(back, new THREE.BoxGeometry(0.97, 0.05, 0.05), frameMat, 0, 0.8, 0);
add(back, new RoundedBoxGeometry(0.88, 0.55, 0.12, 4, 0.05), fabricMat, 0, 0.48, 0.05);

// Legs (geometry swapped when the style changes)
const legGeos = {
  straight: new THREE.CylinderGeometry(0.035, 0.035, 0.45, 20),
  tapered:  new THREE.CylinderGeometry(0.04, 0.02, 0.45, 20),
};
const legMeshes = [[-0.42, -0.38], [0.42, -0.38], [-0.42, 0.38], [0.42, 0.38]]
  .map(([x, z]) => add(chair, legGeos.straight, frameMat, x, 0.225, z));

// Armrests
const arms = new THREE.Group();
arms.visible = false;
chair.add(arms);
const armPost = new THREE.CylinderGeometry(0.022, 0.022, 0.3, 16);
const armPad = new RoundedBoxGeometry(0.08, 0.04, 0.78, 3, 0.015);
for (const s of [-1, 1]) {
  add(arms, armPost, frameMat, s * 0.5, 0.66, 0.3);
  add(arms, armPad, frameMat, s * 0.5, 0.82, -0.04);
}

/* ---------- Smooth material transitions ---------- */
const target = { frame: new THREE.Color(), fabric: new THREE.Color(), sheen: new THREE.Color() };
function updateTargets() {
  target.frame.set(FRAMES[state.frame].color);
  target.fabric.set(state.color);
  target.sheen.set(state.color).offsetHSL(0, 0, 0.25);
}
updateTargets();

let armScale = 0;
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.1);
  const k = 1 - Math.exp(-dt * 8);
  const lerp = THREE.MathUtils.lerp;
  const f = FRAMES[state.frame], fb = FABRICS[state.fabric];
  frameMat.color.lerp(target.frame, k);
  frameMat.metalness = lerp(frameMat.metalness, f.metalness, k);
  frameMat.roughness = lerp(frameMat.roughness, f.roughness, k);
  fabricMat.color.lerp(target.fabric, k);
  fabricMat.sheenColor.lerp(target.sheen, k);
  fabricMat.sheen = lerp(fabricMat.sheen, fb.sheen, k);
  fabricMat.roughness = lerp(fabricMat.roughness, fb.roughness, k);

  // Armrests grow in / shrink out
  armScale = lerp(armScale, state.arms ? 1 : 0, k);
  arms.visible = armScale > 0.01;
  arms.scale.set(1, Math.max(armScale, 0.001), 1);

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

function resize() {
  const { clientWidth: w, clientHeight: h } = viewer;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(viewer);
resize();
tick();

/* ---------- UI ---------- */
const $ = (id) => document.getElementById(id);

function buildOptions(containerId, options, key, renderInner, className) {
  const el = $(containerId);
  for (const [value, opt] of Object.entries(options)) {
    const b = document.createElement('button');
    if (className) b.className = className;
    b.dataset.value = value;
    b.innerHTML = renderInner(opt);
    b.addEventListener('click', () => { state[key] = value; refresh(); });
    el.appendChild(b);
  }
}
const extra = (p) => (p > 0 ? `<small>+${usd(p)}</small>` : '');

buildOptions('frames', FRAMES, 'frame', (o) => `<i style="background:${o.color}"></i>${o.label}${extra(o.price)}`, 'chip');
buildOptions('fabrics', FABRICS, 'fabric', (o) => `${o.label}${extra(o.price)}`);
buildOptions('legs', LEGS, 'legs', (o) => `${o.label}${extra(o.price)}`);

for (const c of COLORS) {
  const b = document.createElement('button');
  b.className = 'swatch';
  b.style.background = c.hex;
  b.dataset.value = c.hex;
  b.setAttribute('aria-label', c.name);
  b.addEventListener('click', () => { state.color = c.hex; refresh(); });
  $('colors').appendChild(b);
}

$('armPrice').textContent = `+${usd(ARMREST_PRICE)}`;
$('arms').addEventListener('change', (e) => { state.arms = e.target.checked; refresh(); });

function markActive(containerId, value, cls) {
  for (const b of $(containerId).children) {
    const on = b.dataset.value === value;
    if (cls) b.className = on ? `${cls} active` : cls;
    else b.classList.toggle('active', on);
  }
}

const colorName = () => COLORS.find((c) => c.hex === state.color)?.name ?? '';

function refresh() {
  markActive('frames', state.frame, 'chip');
  markActive('fabrics', state.fabric);
  markActive('legs', state.legs);
  markActive('colors', state.color, 'swatch');
  $('frameLabel').textContent = FRAMES[state.frame].label;
  $('fabricLabel').textContent = FABRICS[state.fabric].label;
  $('colorLabel').textContent = colorName();
  $('legLabel').textContent = LEGS[state.legs].label;

  for (const m of legMeshes) m.geometry = legGeos[state.legs];
  updateTargets();

  const price = BASE_PRICE + FRAMES[state.frame].price + FABRICS[state.fabric].price
    + LEGS[state.legs].price + (state.arms ? ARMREST_PRICE : 0);
  $('price').textContent = usd(price);
}
refresh();

/* Toast */
let toastTimer;
$('cart').addEventListener('click', () => {
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = `Added: ${FRAMES[state.frame].label} · ${FABRICS[state.fabric].label} ${colorName()}${state.arms ? ' · Armrests' : ''}`;
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 2200);
});

/* Snapshot: shown in a dialog so it can be saved with a long-press */
$('snap').addEventListener('click', () => {
  renderer.render(scene, camera);
  $('snapImg').src = renderer.domElement.toDataURL('image/png');
  $('modal').classList.add('open');
});
$('closeModal').addEventListener('click', () => $('modal').classList.remove('open'));
</script>
</body>
</html>
